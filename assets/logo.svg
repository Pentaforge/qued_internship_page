<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 68" role="img" aria-label="QUED Metrics">
  <!-- ===== Mark: node-head with tentacle links ===== -->
  <g fill="none" stroke="#F4F4F6" stroke-width="2.4" stroke-linecap="round">
    <circle cx="34" cy="27" r="18"/>
    <path d="M21 41c-4 5-7 8-11 9"/>
    <path d="M28 45c-2 5-3 9-4 12"/>
    <path d="M34 46v11"/>
    <path d="M40 45c2 5 3 9 4 12"/>
    <path d="M47 41c4 5 7 8 11 9"/>
  </g>
  <g fill="#F4F4F6">
    <circle cx="8" cy="52" r="3"/>
    <circle cx="23" cy="60" r="3"/>
    <circle cx="34" cy="61" r="3"/>
    <circle cx="45" cy="60" r="3"/>
    <circle cx="60" cy="52" r="3"/>
  </g>

  <!-- ===== Divider ===== -->
  <line x1="74" y1="9" x2="74" y2="45" stroke="#F4F4F6" stroke-opacity=".32" stroke-width="1.4"/>

  <!-- ===== Wordmark: geometric squarish letterforms (drawn, not typeset) ===== -->
  <g fill="none" stroke="#F4F4F6" stroke-width="3.1" stroke-linejoin="miter" stroke-linecap="butt">
    <!-- Q -->
    <path d="M96 9h13l6 6v13l-6 6H96l-6-6V15z"/>
    <path d="M108 27l9 10"/>
    <!-- U -->
    <path d="M129 9v19l6 6h11l6-6V9"/>
    <!-- D -->
    <path d="M197 34V9h13l6 6v13l-6 6z"/>
  </g>
  <!-- E, as three bars (brochure mark) -->
  <g fill="#F4F4F6">
    <rect x="165" y="9"    width="19" height="3.1"/>
    <rect x="165" y="19.4" width="19" height="3.1"/>
    <rect x="165" y="29.9" width="19" height="3.1"/>
  </g>

  <!-- ===== Sub-wordmark ===== -->
  <text x="91" y="50" textLength="131" lengthAdjust="spacing"
        font-family="'JetBrains Mono', ui-monospace, Consolas, monospace"
        font-size="10.5" fill="#B39BFF">METRICS</text>
</svg>
